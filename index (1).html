        const playBeep = (isCorrect, soundEnabled) => {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (isCorrect) {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
                }
                
                osc.start();
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) { console.log("Audio not supported"); }
        };

            // Simplified display for special angles for educational purposes
            angle = ((angle % 360) + 360) % 360; 
            const ref = angle % 90;
            
            if (func === 'tan' && (angle === 90 || angle === 270)) return "Tak Terdefinisi";
            
            // Just returning decimal string if not special angle for simplicity in this function
            if (angle % 30 !== 0 && angle % 45 !== 0) return formatNumber(val);

            if (Math.abs(val) < 0.01) return "0";
            if (Math.abs(val - 1) < 0.01) return "1";
            if (Math.abs(val + 1) < 0.01) return "-1";
            
            const sign = val < 0 ? "-" : "";
            const absVal = Math.abs(val);

            if (Math.abs(absVal - 0.5) < 0.01) return sign + "½";
            if (Math.abs(absVal - Math.sqrt(2)/2) < 0.01) return sign + "½√2";
            if (Math.abs(absVal - Math.sqrt(3)/2) < 0.01) return sign + "½√3";
            if (Math.abs(absVal - Math.sqrt(3)) < 0.01) return sign + "√3";
            if (Math.abs(absVal - Math.sqrt(3)/3) < 0.01) return sign + "⅓√3";

            return formatNumber(val);
        };

        // 3. Materi Pembelajaran Component

        // 4. Contoh Soal Component
        const ContohSoal = ({ goBack }) => {

        // 5. Latihan Soal Component
        const LatihanSoal = ({ goBack, soundEnabled }) => {
            const [status, setStatus] = useState('start'); // start, playing, result
            const [questions, setQuestions] = useState([]);
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [feedback, setFeedback] = useState(null); // {isCorrect: true/false, correctAns: string}
            const [stats, setStats] = useState({ correct: 0, wrong: 0 });

            const startQuiz = () => {
                const shuffled = [...LATIHAN_SOAL].sort(() => 0.5 - Math.random());
                setQuestions(shuffled);
                setCurrentQIndex(0);
                setScore(0);
                setStats({ correct: 0, wrong: 0 });
                setStatus('playing');
                setFeedback(null);
            };

            const handleAnswer = (selectedIndex) => {
                if (feedback) return; // Prevent double clicking
                
                const q = questions[currentQIndex];
                const isCorrect = selectedIndex === q.ans;
                
                playBeep(isCorrect, soundEnabled);

                if (isCorrect) {
                    setScore(score + (q.level * 10)); // Higher level = more points
                    setStats(prev => ({ ...prev, correct: prev.correct + 1 }));
                } else {
                    setStats(prev => ({ ...prev, wrong: prev.wrong + 1 }));
                }

                setFeedback({
                    isCorrect,
                    correctAns: q.opts[q.ans]
                });
            };

            const nextQuestion = () => {
                if (currentQIndex < questions.length - 1) {
                    setCurrentQIndex(currentQIndex + 1);
                    setFeedback(null);
                } else {
                    setStatus('result');
                }
            };

            if (status === 'start') {
                return (
                    <div className="flex flex-col items-center justify-center h-screen px-4 fade-in">

                    </div>

            if (status === 'result') {

                    <div className="flex flex-col items-center justify-center h-screen px-4 fade-in">

                            <h2 className="text-3xl font-bold text-white mb-2">LATIHAN SELESAI</h2>

                            <div className="grid grid-cols-2 gap-4 mb-8">
                                <div className="bg-green-500/20 border border-green-500 rounded-lg p-4">

                                    <div className="text-xl font-bold text-green-400">{stats.correct} Benar</div>
                                </div>
                                <div className="bg-red-500/20 border border-red-500 rounded-lg p-4">
                                    <div className="text-3xl mb-1">❌</div>
                                    <div className="text-xl font-bold text-red-400">{stats.wrong} Salah</div>
                                </div>
                            </div>
                            
                            <div className="text-xl text-gray-300 mb-8">Skor Total: <span className="font-bold text-white">{score}</span></div>
                            
                            <button onClick={startQuiz} className="px-8 py-3 bg-gold text-darkred font-bold rounded-full shadow-[0_0_15px_rgba(255,215,0,0.5)] hover:scale-105 transition">
                                ULANGI LATIHAN
                            </button>
                        </div>
                    </div>
                );
            }

            const q = questions[currentQIndex];
            const progress = ((currentQIndex) / questions.length) * 100;

            return (
                <div className="p-6 max-w-3xl mx-auto fade-in flex flex-col h-screen">
                    <div className="flex items-center justify-between mb-4">
                        <button onClick={goBack} className="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg text-sm">Keluar</button>
                        <div className="text-gold font-bold">Soal {currentQIndex + 1} / {questions.length}</div>
                        <div className="text-gold font-bold">Skor: {score}</div>
                    </div>
                    
                    {/* Progress Bar */}
                    <div className="w-full bg-gray-800 h-2 rounded-full mb-8 overflow-hidden">
                        <div className="bg-gold h-full transition-all duration-300" style={{width: `${progress}%`}}></div>
                    </div>

                    <div className="glass-panel p-8 rounded-2xl flex-grow flex flex-col justify-center">
                        <div className="text-sm text-orange-400 font-bold mb-2">Level Kesulitan: {q.level === 1 ? 'Mudah' : q.level === 2 ? 'Sedang' : 'Sulit'}</div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

                                    if (i === q.ans) btnClass += "bg-green-600/50 border-green-500 ";
                                    else if (i !== q.ans) btnClass += "opacity-50 ";

                                return (
                                    <button 
                                        key={i} 
                                        onClick={() => handleAnswer(i)}

                                        <span className="font-bold mr-3">{String.fromCharCode(65+i)}.</span> {opt}

                        {feedback && (

                </div>

        };

        // 6. Laboratorium / Simulasi Component
        const Simulasi = ({ goBack }) => {
            const [angle, setAngle] = useState(45);
            const [autoPlay, setAutoPlay] = useState(false);
            const requestRef = useRef();

            const animate = () => {
                setAngle(prev => (prev + 1) % 360);
                requestRef.current = requestAnimationFrame(animate);
            };

            useEffect(() => {
                if (autoPlay) {
                    requestRef.current = requestAnimationFrame(animate);
                } else {
                    cancelAnimationFrame(requestRef.current);
                }
                return () => cancelAnimationFrame(requestRef.current);
            }, [autoPlay]);

            const handleAngleChange = (e) => {
                let val = parseInt(e.target.value);
                if (isNaN(val)) val = 0;
                // keep between 0-360
                val = ((val % 360) + 360) % 360;
                setAngle(val);
                setAutoPlay(false);
            };

            const rad = angle * (Math.PI / 180);
            const sinVal = Math.sin(rad);
            const cosVal = Math.cos(rad);
            const tanVal = Math.tan(rad);
            
            let kuadran = "";
            if (angle === 0 || angle === 360) kuadran = "Batas I & IV";
            else if (angle < 90) kuadran = "I";
            else if (angle === 90) kuadran = "Batas I & II";
            else if (angle < 180) kuadran = "II";
            else if (angle === 180) kuadran = "Batas II & III";
            else if (angle < 270) kuadran = "III";
            else if (angle === 270) kuadran = "Batas III & IV";
            else kuadran = "IV";

            // SVG Constants
            const cx = 150;
            const cy = 150;
            const r = 100;
            const px = cx + (r * cosVal);
            const py = cy - (r * sinVal); // minus because SVG y is down

            // Arc Path for angle
            const largeArcFlag = angle > 180 ? 1 : 0;
            const arcPath = angle === 0 ? "" : `M ${cx+r/4} ${cy} A ${r/4} ${r/4} 0 ${largeArcFlag} 0 ${cx + (r/4 * cosVal)} ${cy - (r/4 * sinVal)}`;

            return (
                <div className="p-4 md:p-6 max-w-6xl mx-auto fade-in flex flex-col h-screen">
                    <div className="flex items-center justify-between mb-4">
                        <button onClick={goBack} className="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg font-bold">← Dashboard</button>
                        <h2 className="text-xl md:text-2xl font-bold text-gold text-center flex-grow">LABORATORIUM LINGKARAN SATUAN</h2>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-6 flex-grow">
                        {/* Interactive Canvas Area */}
                        <div className="glass-panel p-6 rounded-2xl flex flex-col items-center justify-center flex-1 relative min-h-[400px]">
                            
                            <h3 className="absolute top-4 left-6 text-xl font-bold text-white bg-black/40 px-3 py-1 rounded">Kuadran {kuadran}</h3>

                            <svg width="300" height="300" className="drop-shadow-2xl">
                                {/* Grid & Axes */}
                                <line x1="0" y1="150" x2="300" y2="150" stroke="rgba(255,255,255,0.3)" strokeWidth="1" />
                                <line x1="150" y1="0" x2="150" y2="300" stroke="rgba(255,255,255,0.3)" strokeWidth="1" />
                                <text x="280" y="145" fill="white" fontSize="12">X</text>
                                <text x="155" y="20" fill="white" fontSize="12">Y</text>

                                {/* Circle */}
                                <circle cx="150" cy="150" r="100" fill="none" stroke="#ffd700" strokeWidth="2" />
                                
                                {/* Angle Arc */}
                                <path d={arcPath} fill="none" stroke="#ff3333" strokeWidth="3" />
                                
                                {/* Projection Lines */}
                                <line x1={px} y1={py} x2={px} y2="150" stroke="#ff3333" strokeWidth="2" strokeDasharray="4,4" />
                                <line x1={px} y1={py} x2="150" y2={py} stroke="#ffd700" strokeWidth="2" strokeDasharray="4,4" />

                                {/* Radius Line */}
                                <line x1="150" y1="150" x2={px} y2={py} stroke="white" strokeWidth="3" />
                                
                                {/* Point */}
                                <circle cx={px} cy={py} r="6" fill="#ffd700" className="animate-pulse" />
                                
                                {/* Labels near point */}
                                <text x={px > 150 ? px + 10 : px - 40} y={py > 150 ? py + 20 : py - 10} fill="white" fontSize="12" fontWeight="bold">
                                    {angle}°
                                </text>
                            </svg>

                            {/* Controls */}
                            <div className="mt-8 w-full max-w-md bg-black/30 p-4 rounded-xl">
                                <div className="flex items-center justify-between mb-2 text-sm font-bold">
                                    <span>0°</span>
                                    <span>Sudut: {angle}°</span>
                                    <span>360°</span>
                                </div>
                                <input 
                                    type="range" 
                                    min="0" max="360" 
                                    value={angle} 
                                    onChange={(e) => {setAngle(parseInt(e.target.value)); setAutoPlay(false);}}
                                    className="w-full cursor-pointer accent-gold mb-4"
                                />
                                <div className="flex justify-center gap-2">
                                    <button onClick={() => {setAngle(prev => (prev-1+360)%360); setAutoPlay(false);}} className="px-3 py-2 bg-white/20 rounded hover:bg-white/30 text-xl font-bold">-</button>
                                    <input 
                                        type="number" 
                                        value={angle} 
                                        onChange={handleAngleChange}
                                        className="w-20 text-center bg-white/10 border border-white/30 rounded text-white font-bold px-2 focus:outline-none focus:border-gold"
                                    />
                                    <button onClick={() => {setAngle(prev => (prev+1)%360); setAutoPlay(false);}} className="px-3 py-2 bg-white/20 rounded hover:bg-white/30 text-xl font-bold">+</button>
                                    
                                    <button 
                                        onClick={() => setAutoPlay(!autoPlay)} 
                                        className={`ml-4 px-4 py-2 rounded font-bold transition ${autoPlay ? 'bg-red-500 hover:bg-red-600 text-white' : 'bg-green-500 hover:bg-green-600 text-white'}`}
                                    >
                                        {autoPlay ? '⏹ Berhenti' : '▶ Putar'}
                                    </button>
                                    <button onClick={() => {setAngle(0); setAutoPlay(false);}} className="px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded font-bold text-white">Reset</button>
                                </div>
                            </div>
                        </div>

                        {/* Data Panel */}
                        <div className="glass-panel p-6 rounded-2xl flex-1 flex flex-col space-y-6">
                            <h3 className="text-2xl font-bold border-b border-white/20 pb-2">Informasi Sudut</h3>
                            
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-black/20 p-4 rounded-xl border border-gold/30">
                                    <div className="text-gray-400 text-sm">Sudut (θ)</div>
                                    <div className="text-3xl font-bold text-gold">{angle}°</div>
                                </div>
                                <div className="bg-black/20 p-4 rounded-xl border border-red-500/30">
                                    <div className="text-gray-400 text-sm">Kuadran</div>
                                    <div className="text-3xl font-bold text-brightred">{kuadran}</div>
                                </div>
                            </div>

                            <div className="bg-black/20 p-4 rounded-xl flex-grow flex flex-col justify-center space-y-4">
                                <div className="flex justify-between items-center border-b border-white/10 pb-2">
                                    <span className="text-xl font-bold w-24">sin θ</span>
                                    <span className="text-gray-400 text-sm flex-grow text-center">(Sumbu Y)</span>
                                    <span className={`text-2xl font-mono font-bold w-24 text-right ${sinVal >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                        {getTrigFraction(sinVal, 'sin', angle)}
                                    </span>
                                </div>
                                <div className="flex justify-between items-center border-b border-white/10 pb-2">
                                    <span className="text-xl font-bold w-24">cos θ</span>
                                    <span className="text-gray-400 text-sm flex-grow text-center">(Sumbu X)</span>
                                    <span className={`text-2xl font-mono font-bold w-24 text-right ${cosVal >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                        {getTrigFraction(cosVal, 'cos', angle)}
                                    </span>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span className="text-xl font-bold w-24">tan θ</span>
                                    <span className="text-gray-400 text-sm flex-grow text-center">(sin / cos)</span>
                                    <span className={`text-2xl font-mono font-bold w-24 text-right ${tanVal >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                        {getTrigFraction(tanVal, 'tan', angle)}
                                    </span>
                                </div>
                            </div>

                            <div className="bg-yellow-500/10 border border-gold p-4 rounded-xl">
                                <h4 className="font-bold text-gold mb-1">Koordinat Titik</h4>
                                <p className="font-mono text-lg">( x, y ) = ( {formatNumber(cosVal)}, {formatNumber(sinVal)} )</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 7. Pengembang Component
        const Pengembang = ({ goBack }) => (
            <div className="flex flex-col items-center justify-center h-screen px-4 fade-in">
                <button onClick={goBack} className="absolute top-6 left-6 px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg">← Kembali</button>
                <div className="glass-panel p-10 rounded-2xl max-w-lg text-center shadow-[0_0_30px_rgba(255,51,51,0.2)]">
                    <div className="w-32 h-32 mx-auto bg-gradient-to-tr from-gold to-brightred rounded-full flex items-center justify-center mb-6 shadow-lg border-4 border-white/20">
                        <span className="text-6xl">👨‍🏫</span>
                    </div>
                    <h2 className="text-3xl font-bold text-white mb-2">FANGKI MURSID, S.Pd.</h2>
                    <h3 className="text-xl text-gold font-semibold mb-4">GURU MATEMATIKA</h3>
                    <div className="bg-white/10 py-2 px-6 rounded-full inline-block mb-6 border border-white/20">
                        <span className="font-bold tracking-widest text-orange-300">SMAN 1 DULUPI</span>
                    </div>
                    <p className="text-gray-300 leading-relaxed italic border-t border-white/20 pt-6">
                        "Multimedia Pembelajaran Interaktif ini dikembangkan sebagai inovasi pembelajaran matematika berbasis teknologi digital untuk membantu peserta didik memahami konsep fungsi trigonometri melalui eksplorasi, visualisasi, dan simulasi interaktif."
                    </p>
                </div>
            </div>
        );


        // --- MAIN APP CONTAINER ---
        const App = () => {
            const [currentPage, setCurrentPage] = useState('welcome');
            const [soundEnabled, setSoundEnabled] = useState(true);

            // Simple navigation router
            const renderPage = () => {
                switch(currentPage) {
                    case 'welcome': return <WelcomePage onStart={() => setCurrentPage('dashboard')} />;
                    case 'dashboard': return <Dashboard navigateTo={setCurrentPage} />;
                    case 'materi': return <MateriPembelajaran goBack={() => setCurrentPage('dashboard')} />;
                    case 'contoh': return <ContohSoal goBack={() => setCurrentPage('dashboard')} />;
                    case 'latihan': return <LatihanSoal goBack={() => setCurrentPage('dashboard')} soundEnabled={soundEnabled} />;
                    case 'simulasi': return <Simulasi goBack={() => setCurrentPage('dashboard')} />;
                    case 'pengembang': return <Pengembang goBack={() => setCurrentPage('dashboard')} />;
                    default: return <WelcomePage onStart={() => setCurrentPage('dashboard')} />;
                }
            };

            return (
                <div className="relative min-h-screen">
                    {/* Top Right Controls (Sound toggle) */}
                    <div className="absolute top-4 right-4 z-50 flex gap-2">
                        <button 
                            onClick={() => setSoundEnabled(!soundEnabled)}
                            className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 border border-white/20 transition-all text-xl"
                            title={soundEnabled ? "Matikan Suara" : "Nyalakan Suara"}
                        >
                            {soundEnabled ? '🔊' : '🔇'}
                        </button>
                    </div>

                    {renderPage()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
